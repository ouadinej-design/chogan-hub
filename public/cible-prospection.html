<!DOCTYPE html>

<title>Cible Prospection Chogan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f5;font-family:-apple-system,sans-serif;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh}

/* ── ÉCRAN NOM ── */
#name-screen{position:fixed;inset:0;z-index:200;background:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.name-card{background:#fff;border-radius:20px;padding:36px 24px;width:100%;max-width:420px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.n-icon{font-size:56px;margin-bottom:16px}
.n-title{font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.n-sub{font-size:14px;color:#888;line-height:1.6;margin-bottom:28px}
#name-input{width:100%;padding:16px;border-radius:14px;border:2px solid #eee;font-size:18px;text-align:center;outline:none;font-family:inherit;margin-bottom:14px;color:#1a1a1a;transition:border-color .2s}
#name-input:focus{border-color:#E24B4A}
#name-input::placeholder{color:#ccc}
#btn-start{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;font-family:inherit;background:#eee;color:#bbb;cursor:not-allowed;transition:all .25s}
#btn-start.ok{background:#E24B4A;color:#fff;cursor:pointer}

/* ── TIMER BAR ── */
#timer-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;background:#fff;border-bottom:1px solid #eee;display:none;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#timer-bar.show{display:flex}
.t-svg{flex-shrink:0;width:48px;height:48px}
.t-info{flex:1;min-width:0}
.t-name{font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-hint{font-size:11px;color:#888;margin-top:1px}
#btn-send{flex-shrink:0;padding:10px 14px;border-radius:10px;border:none;background:#E24B4A;color:#fff;font-size:12px;font-weight:700;cursor:pointer}

/* ── LAYOUT MOBILE ── */
#app{display:none;flex-direction:column;padding:0 0 20px;width:100%;max-width:480px}
#app.show{display:flex}
.section{background:#fff;margin:10px 12px 0;border-radius:16px;overflow:hidden}
.section-head{font-size:13px;font-weight:700;color:#1a1a1a;padding:14px 16px 0}

/* ── CIBLE ── */
#target-wrap{width:100%;aspect-ratio:1;max-width:300px;margin:10px auto}
.legend-row{display:flex;justify-content:center;gap:16px;padding:8px 16px 14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#555}
.leg-dot{width:10px;height:10px;border-radius:50%}

/* ── STATS ── */
.stats-row{display:flex;gap:8px;padding:10px 12px}
.stat{flex:1;background:#f5f5f5;border-radius:10px;padding:10px 6px;text-align:center}
.stat-n{font-size:20px;font-weight:700;color:#1a1a1a}
.stat-l{font-size:10px;color:#888;margin-top:2px}

/* ── FILTRES ── */
.filter-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.f-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid #eee;font-size:13px;font-weight:600;background:#fff;color:#888;cursor:pointer}
.f-btn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* ── LISTE PROSPECTS ── */
#prospect-list{padding:0 12px 12px}
.cat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#aaa;padding:10px 4px 4px;display:block}
.p-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:4px;background:#fafafa;border:1.5px solid #f0f0f0;cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
.p-item:active{background:#f0f0f0}
.p-item.placed{opacity:.4}
.p-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1.5px solid #ddd}
.p-name{flex:1;font-size:14px;color:#1a1a1a;font-weight:500}
.p-zone{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.p-arr{font-size:16px;color:#ccc;margin-left:2px}

/* ── BOTTOM SHEET ── */
#overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.5);display:none;opacity:0;transition:opacity .25s}
#overlay.show{display:block;opacity:1}
#bottom-sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:160;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom)+16px);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:75vh;overflow-y:auto}
#bottom-sheet.show{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:#e0e0e0;margin:0 auto 16px}
.sheet-title{font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:4px;text-align:center}
.sheet-sub{font-size:11px;color:#aaa;text-align:center;margin-bottom:16px}
.zone-btn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:2px solid #eee;background:#fafafa;transition:all .15s;-webkit-tap-highlight-color:transparent}
.zone-btn:active{transform:scale(.98)}
.zone-btn.selected{border-width:2px}
.z-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.z-label{font-size:15px;font-weight:700;color:#1a1a1a}
.z-sub{font-size:12px;color:#888;margin-top:2px}
.z-check{margin-left:auto;font-size:20px}
.sheet-remove{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:#fff0f0;color:#cc3333;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;border:2px solid #ffdddd}
.sheet-remove:active{opacity:.8}

/* ── MODAL RÉSULTAT ── */
#result-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#result-modal.show{display:flex}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom)+20px);width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-head{text-align:center;margin-bottom:18px}
.modal-icon{font-size:42px;margin-bottom:8px}
.modal-title{font-size:20px;font-weight:700;color:#1a1a1a}
.modal-sub{font-size:13px;color:#888;margin-top:4px}
.summary-box{background:#f5f5f5;border-radius:12px;padding:14px;font-size:12px;line-height:1.8;font-family:monospace;color:#333;margin-bottom:16px;max-height:180px;overflow-y:auto;white-space:pre-wrap}
.m-btn{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px}
.m-btn-primary{background:#1a1a1a;color:#fff;border:none}
.m-btn-secondary{background:#fff;color:#1a1a1a;border:2px solid #eee}
.m-btn-close{background:#f5f5f5;color:#888;border:none;font-size:14px}

  </div>

  <!-- LISTE -->

    <div class="section-head">👥 Prospects</div>

    <div id="prospect-list"></div>
  </div>

</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closePicker()"></div>

<!-- BOTTOM SHEET -->
<div id="bottom-sheet">
  <div class="sheet-handle"></div>

  <div id="zone-btns"></div>

const state={placed:{},filter:'all',activeId:null};
let stagName='';

// ── NOM ──
const nameInput=document.getElementById('name-input');
const btnStart=document.getElementById('btn-start');
nameInput.addEventListener('input',function(){
  btnStart.className=this.value.trim().length>=2?'ok':'';
});
nameInput.addEventListener('keydown',function(e){if(e.key==='Enter')startExercise();});
btnStart.addEventListener('click',startExercise);
setTimeout(()=>nameInput.focus(),400);

function startExercise(){
  stagName=nameInput.value.trim();
  if(stagName.length<2)return;
  document.getElementById('name-screen').style.display='none';
  document.getElementById('timer-bar').classList.add('show');
  document.getElementById('app').classList.add('show');
  document.getElementById('t-name').textContent='⏱ '+stagName+', 3 minutes !';
  render();
  startTimer();
}

// ── TIMER ──
const TOTAL=180,CIRC=125.66;
let rem=TOTAL;
function startTimer(){
  const iv=setInterval(()=>{
    rem--;
    const m=Math.floor(rem/60),s=rem%60;
    const col=rem>60?'#378ADD':rem>30?'#EF9F27':'#E24B4A';
    const ring=document.getElementById('t-ring');
    const txt=document.getElementById('t-txt');
    ring.setAttribute('stroke-dashoffset',String(CIRC*(1-rem/TOTAL)));
    ring.setAttribute('stroke',col);
    txt.textContent=m+':'+(s<10?'0':'')+s;
    txt.setAttribute('fill',col);
    if(rem<=0){
      clearInterval(iv);
      document.getElementById('t-name').textContent='⏰ Temps écoulé !';
      openModal();
    }
  },1000);
}

// ── FILTRES ──

    {id:'all',label:'Tous ('+PROSPECTS.length+')'},
    {id:'b2c',label:'B2C ('+PROSPECTS.filter(p=>p.cat==='b2c').length+')'},
    {id:'b2b',label:'B2B ('+PROSPECTS.filter(p=>p.cat==='b2b').length+')'},
  ];
  document.getElementById('filter-row').innerHTML=fs.map(f=>
    '<button class="f-btn'+(state.filter===f.id?' on':'')+'" onclick="setFilter(\''+f.id+'\')">'+f.label+'</button>'
  ).join('');
}
function setFilter(f){state.filter=f;renderFilters();renderProspects();}

// ── PROSPECTS ──
function renderProspects(){
  const list=PROSPECTS.filter(p=>state.filter==='all'||p.cat===state.filter);
  const byType={};
  list.forEach(p=>{if(!byType[p.type])byType[p.type]=[];byType[p.type].push(p);});
  document.getElementById('prospect-list').innerHTML=Object.entries(byType).map(([type,items])=>
    '<span class="cat-lbl">'+type+'</span>'+
    items.map(p=>{
      const z=state.placed[p.id];
      const zone=z?ZONES.find(zz=>zz.id===z):null;
      return'<div class="p-item'+(z?' placed':'')+'" onclick="openPicker(\''+p.id+'\')">'+
        '<div class="p-dot" style="'+(zone?'background:'+zone.color+';border-color:'+zone.color:'')+'"></div>'+
        '<div class="p-name">'+p.name+'</div>'+
        (zone?'<div class="p-zone" style="background:'+zone.bg+';color:'+zone.text+'">'+zone.label+'</div>':'<div class="p-arr">›</div>')+
      '</div>';
    }).join('')
  ).join('');
}

// ── BOTTOM SHEET ──
function openPicker(id){
  state.activeId=id;
  const p=PROSPECTS.find(p=>p.id===id);
  const already=state.placed[id];
  document.getElementById('sheet-pname').textContent=p?p.name:'';
  document.getElementById('zone-btns').innerHTML=ZONES.map(z=>{
    const sel=already===z.id;
    return'<div class="zone-btn'+(sel?' selected':'')+'" onclick="assignZone(\''+z.id+'\')" style="'+(sel?'border-color:'+z.color+';background:'+z.bg:'')+'">'+
      '<div class="z-dot" style="background:'+z.color+'"></div>'+
      '<div><div class="z-label" style="color:'+(sel?z.text:'#1a1a1a')+'">'+z.label+'</div>'+
      '<div class="z-sub">'+z.sub+'</div></div>'+
      (sel?'<div class="z-check" style="color:'+z.color+'">✓</div>':'')+
    '</div>';
  }).join('');
  document.getElementById('sheet-remove').style.display=already?'flex':'none';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('bottom-sheet').classList.add('show');
}
function assignZone(zoneId){
  if(state.activeId) state.placed[state.activeId]=zoneId;
  closePicker();render();
}
function removeProspect(){
  if(state.activeId) delete state.placed[state.activeId];
  closePicker();render();
}
function closePicker(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('bottom-sheet').classList.remove('show');
  state.activeId=null;
}

// ── CIBLE SVG ──
function renderTarget(){
  const wrap=document.getElementById('target-wrap');
  const size=Math.min(wrap.offsetWidth||280,280);
  const cx=size/2,cy=size/2;
  const rings={chaud:{inner:0,outer:size*.14},tiede:{inner:size*.17,outer:size*.27},froid:{inner:size*.31,outer:size*.43}};
  const counts={chaud:0,tiede:0,froid:0};
  const colors={chaud:'#E24B4A',tiede:'#EF9F27',froid:'#378ADD'};
  let dots='';
  Object.entries(state.placed).forEach(([id,zone])=>{
    const ring=rings[zone];if(!ring)return;
    const idx=counts[zone]||0;counts[zone]++;
    const angle=idx*137.508*(Math.PI/180);
    const t=(idx*0.618)%1;
    const r=ring.inner+(ring.outer-ring.inner)*(0.2+t*0.7);
    const p=PROSPECTS.find(p=>p.id===id);
    dots+='<circle cx="'+(cx+Math.cos(angle)*r)+'" cy="'+(cy+Math.sin(angle)*r)+'" r="5" fill="'+colors[zone]+'" stroke="#fff" stroke-width="1.5" opacity=".95"><title>'+(p?p.name:'')+'</title></circle>';
  });
  wrap.innerHTML='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(size*.46)+'" fill="rgba(55,138,221,.07)" stroke="#378ADD" stroke-width="2"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(size*.30)+'" fill="rgba(239,159,39,.1)" stroke="#EF9F27" stroke-width="2"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+(size*.16)+'" fill="rgba(226,75,74,.15)" stroke="#E24B4A" stroke-width="2.5"/>'+
    '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="11" fill="#A32D2D" font-weight="700">CHAUD</text>'+
    '<text x="'+cx+'" y="'+(cy-size*.215)+'" text-anchor="middle" font-size="10" fill="#854F0B">TIÈDE</text>'+
    '<text x="'+cx+'" y="'+(cy-size*.36)+'" text-anchor="middle" font-size="10" fill="#185FA5">FROID</text>'+
    dots+'</svg>';
}

// ── STATS ──
function renderStats(){
  const total=PROSPECTS.length,placed=Object.keys(state.placed).length;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat"><div class="stat-n">'+total+'</div><div class="stat-l">Total</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#378ADD">'+placed+'</div><div class="stat-l">Placés</div></div>'+
    '<div class="stat"><div class="stat-n" style="color:#639922">'+(total-placed)+'</div><div class="stat-l">Restants</div></div>'+
    '<div class="stat"><div class="stat-n">'+Math.round(placed/total*100)+'%</div><div class="stat-l">Avancement</div></div>';
}

// ── MODAL ──
function buildSummary(){
  let txt='🎯 CIBLE CHOGAN — '+stagName+'\n';
  txt+='Date : '+new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'\n';
  txt+='================================\n';
  const total=Object.keys(state.placed).length;
  txt+=total+' prospect'+(total>1?'s':'')+' identifié'+(total>1?'s':'')+' sur '+PROSPECTS.length+'\n\n';
  ZONES.forEach(z=>{
    const ids=Object.entries(state.placed).filter(([,v])=>v===z.id).map(([id])=>id);
    if(!ids.length)return;
    txt+=z.label.toUpperCase()+' ('+ids.length+')\n';
    ids.forEach(id=>{const p=PROSPECTS.find(p=>p.id===id);txt+='  • '+(p?p.name:id)+'\n';});
    txt+='\n';
  });
  return txt;
}
function openModal(){
  const placed=Object.keys(state.placed).length;
  document.getElementById('modal-title').textContent='Cible de '+stagName;
  document.getElementById('modal-sub').textContent=placed+' prospect'+(placed>1?'s':'')+' identifié'+(placed>1?'s':'');
  document.getElementById('modal-summary').textContent=buildSummary();
  document.getElementById('result-modal').classList.add('show');
}
function copyText(){
  navigator.clipboard.writeText(document.getElementById('modal-summary').textContent).then(()=>{
    const b=document.getElementById('btn-copy');
    b.textContent='✓ Copié !';setTimeout(()=>b.textContent='📋 Copier le résumé',2000);
  });
}
function downloadCapture(){
  document.getElementById('result-modal').classList.remove('show');
  const panel=document.querySelector('.section');
  setTimeout(()=>{
    html2canvas(document.getElementById('target-wrap').parentElement,{scale:2,backgroundColor:'#fff',logging:false}).then(canvas=>{
      const final=document.createElement('canvas');
      final.width=canvas.width;final.height=canvas.height+90;
      const ctx=final.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,final.width,final.height);
      ctx.fillStyle='#E24B4A';ctx.fillRect(0,0,final.width,5);
      ctx.fillStyle='#1a1a1a';
      ctx.font='bold '+(canvas.width*.07)+'px -apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('🎯 '+stagName,final.width/2,52);
      ctx.fillStyle='#888';
      ctx.font=(canvas.width*.038)+'px -apple-system,sans-serif';
      ctx.fillText('Formation Chogan · '+new Date().toLocaleDateString('fr-FR'),final.width/2,76);
      ctx.drawImage(canvas,0,90);
      const a=document.createElement('a');
      a.download='cible-'+stagName.replace(/ /g,'_')+'.png';
      a.href=final.toDataURL('image/png');a.click();
      document.getElementById('result-modal').classList.add('show');
    });
  },300);
}

function render(){renderFilters();renderProspects();renderStats();renderTarget();}
window.addEventListener('resize',renderTarget);
window.setFilter=setFilter;window.assignZone=assignZone;
window.openPicker=openPicker;window.closePicker=closePicker;
window.removeProspect=removeProspect;window.openModal=openModal;
window.copyText=copyText;window.downloadCapture=downloadCapture;
</script>
</body>
</html>
