.btn-g:active{opacity:.85;transform:scale(.98)}

.btn-o{width:100%;padding:14px;border-radius:14px;background:transparent;

/* ── WALLET ENGINE ── */
let curCat=0, curCard=0;
let elevUpdater=null;
const PEEK=15;

function buildPills(){
  const nav=document.getElementById('pill-nav');
  if(nav.children.length) return;
  CATEGORIES.forEach((cat,i)=>{
    const p=document.createElement('div');
    p.className='pill'+(i===0?' active':'');
    p.id='pill-'+i;
    p.innerHTML=cat.em+' '+cat.nm;
    p.onclick=()=>switchCat(i);
    nav.appendChild(p);
  });
  buildCards(0);
  tick();
}

function switchCat(idx){
  curCat=idx; curCard=0;
  document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('active',i===idx));
  document.getElementById('wh-title').textContent=CATEGORIES[idx].nm;
  buildCards(idx);
}

function buildCards(catIdx){
  const cat=CATEGORIES[catIdx];
  const se=document.getElementById('stack');
  const de=document.getElementById('dots');
  Array.from(se.querySelectorAll('.wcard')).forEach(el=>el.remove());
  Array.from(se.querySelectorAll('.elev-wrap')).forEach(el=>el.remove());
  de.innerHTML='';

  cat.cards.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='wcard '+c.th;
    el.id='wc'+i;
    el.innerHTML=`<div class="ci">
      <div class="cb1" style="width:150px;height:150px;background:rgba(${c.r},${c.g},${c.b},.7);top:-45px;right:-35px"></div>
      <div class="cb2" style="width:75px;height:75px;background:rgba(${c.r},${c.g},${c.b},.6);bottom:-15px;left:25px"></div>
      <div class="ct">
        <div><div class="ct-c">${c.cat}</div><div class="ct-n">${c.nm}</div></div>
        <div class="ct-i">${c.em}</div>
      </div>
      <div class="cbx">
        <div><div class="cb-sl">${c.sl}</div><div class="cb-sv">${c.sv}</div></div>
        <div class="cb-ch"><div class="cd" style="background:rgba(255,255,255,.6)"></div>${c.chip}</div>
      </div>
    </div>`;
    el.addEventListener('click',()=>{
      if(i===curCard) openCard(c);
      else goCard(i);
    });
    se.appendChild(el);
    const d=document.createElement('div');
    d.className='dot'+(i===0?' on':'');
    d.id='dt'+i;
    d.onclick=()=>goCard(i);
    de.appendChild(d);
  });

  buildElev(se, cat.cards.length);
  posCards(false);
}

function posCards(anim=true){
  const cat=CATEGORIES[curCat];
  cat.cards.forEach((_,i)=>{
    const el=document.getElementById('wc'+i); if(!el) return;
    const diff=i-curCard;
    let top,scale,opacity;
    if(diff===0){top=14;scale=1;opacity=1}
    else if(diff<0){top=-210;scale=1;opacity=0}
    else{top=14+diff*PEEK;scale=1-diff*.04;opacity=diff<=7?Math.max(0.2,1-diff*.14):0}
    el.style.transition=anim?'top .42s cubic-bezier(.4,0,.2,1),transform .42s,opacity .32s':'none';
    el.style.top=top+'px';el.style.transform=`scale(${scale})`;el.style.opacity=opacity;
    el.style.zIndex=20-Math.abs(i-curCard);
    const d=document.getElementById('dt'+i);
    if(d) d.className='dot'+(i===curCard?' on':'');
  });
  if(elevUpdater) elevUpdater(curCard, CATEGORIES[curCat].cards.length);
}

function goCard(i){
  const n=CATEGORIES[curCat].cards.length;
  if(i<0||i>=n)return;
  curCard=i; posCards(true);
}

function buildElev(stackEl, total){
  const wrap=document.createElement('div');
  wrap.className='elev-wrap';
  wrap.id='elev-wrap';
  wrap.innerHTML=`<div class="elev-track" id="elev-track"><div class="elev-thumb" id="elev-thumb"></div></div>`;
  stackEl.appendChild(wrap);

  let active=false;

  function getIdx(clientY){
    const track=document.getElementById('elev-track');
    if(!track) return 0;
    const rect=track.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
    return Math.round(pct*(total-1));
  }

  function updateThumb(cur,tot){
    const thumb=document.getElementById('elev-thumb');
    const track=document.getElementById('elev-track');
    if(!thumb||!track||tot<=1) return;
    const h=track.getBoundingClientRect().height-46;
    thumb.style.top=(cur/Math.max(1,tot-1)*h)+'px';
  }

  wrap.addEventListener('touchstart',e=>{e.stopPropagation();active=true;goCard(getIdx(e.touches[0].clientY));},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(!active)return;e.stopPropagation();goCard(getIdx(e.touches[0].clientY));},{passive:true});
  wrap.addEventListener('touchend',()=>{active=false;},{passive:true});

  elevUpdater=updateThumb;
  updateThumb(0,total);
}

/* ── SESSION TRACKING ── */
const SESSION={cards:[],sent:false};
function trackCard(card){
  const now=new Date();
  SESSION.cards.push({em:card.em,nm:card.nm,time:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
}

/* ── DETAIL ── */
function openCard(c){
  trackCard(c);
  const {r,g,b}=c;
  const ib=`rgba(${r},${g},${b},.14)`;
  const ic=`rgb(${Math.min(255,r+40)},${Math.min(255,g+30)},${Math.min(255,b+20)})`;
  let flow='';
  if(c.flow) flow=`<div class="fpills">${c.flow.map((s,i)=>`<span class="fp">${s}</span>${i<c.flow.length-1?'<span class="fa">›</span>':''}`).join('')}</div>`;
  const rows=c.items.map((it,i)=>`
    <div class="si" style="animation-delay:${i*.05}s">
      <div class="sii" style="background:${ib};color:${ic}">${it.i}</div>
      <div><div class="sit">${it.t}</div><div class="sid">${it.d}</div>
      ${it.q?`<div class="siq" style="border-color:${ic}">${it.q}</div>`:''}</div>
    </div>`).join('');

  document.getElementById('detail-content').innerHTML=`
    <div style="position:sticky;top:0;background:var(--bg);z-index:10;padding:calc(12px + var(--st)) 18px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid rgba(0,0,0,.1)">
      <button onclick="cls()" style="display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.09);border:0.5px solid rgba(0,0,0,.15);border-radius:20px;padding:8px 16px;color:var(--taupe);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit">← Retour</button>
      <button onclick="cls()" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.09);border:0.5px solid rgba(0,0,0,.12);color:var(--taupe);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
    <div class="shcard ${c.th}" style="margin:14px 18px 0">
      <div class="cb1" style="width:130px;height:130px;background:rgba(${r},${g},${b},.7);top:-30px;right:-30px"></div>
      <div class="sht"><div class="shname">${c.nm}</div><div class="shemo">${c.em}</div></div>
      <div class="shhv">${c.hero.v}</div><div class="shhl">${c.hero.l}</div>
    </div>${flow}
    <div style="padding:10px 18px calc(40px + var(--sb)) 18px">${rows}</div>`;

  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('detail').scrollTop=0;
}

function cls(){
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
}

/* ── CLOCK / TOAST ── */
function tick(){
  const t=new Date();
  try{document.getElementById('clk').textContent=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');}catch(e){}
}
tick();setInterval(tick,15000);

let _tt=null;
function toast(msg,type='in'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show t-'+type;
  clearTimeout(_tt);_tt=setTimeout(()=>el.className='',3200);
}

/* ── INFO ── */
function showInfo(){
  const old=document.getElementById('info-ov'); if(old){old.remove();return;}
  const ov=document.createElement('div');
  ov.id='info-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div style="background:var(--surface);border-radius:26px 26px 0 0;padding:26px 22px calc(32px + var(--sb));width:100%;max-width:480px;border-top:0.5px solid rgba(0,0,0,.1)">
    <div style="width:36px;height:4px;background:rgba(0,0,0,.14);border-radius:2px;margin:0 auto 22px"></div>
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:42px;margin-bottom:10px">💼</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px;font-family:inherit;color:var(--taupe)">Wallet Chogan</div>
      <div style="font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:inherit">Guide de vente professionnel</div>
    </div>
    <div style="background:rgba(210,183,149,.12);border:0.5px solid rgba(210,183,149,.25);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.7">
      7 catégories · 6 cartes chacune<br>
      Utilisez les <strong style="color:var(--taupe)">pills de navigation</strong> en haut pour changer de catégorie.<br>
      L'<strong style="color:var(--taupe)">ascenseur droit</strong> fait défiler les cartes.<br>
      Appuyez sur une carte pour voir le détail.
    </div>
    <button onclick="document.getElementById('info-ov').remove()" style="width:100%;padding:14px;border-radius:14px;background:var(--taupe);border:none;color:var(--champagne);font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:.5px">Fermer</button>
  </div>`;
  document.getElementById('main').appendChild(ov);
}

/* ── SESSION REPORT ── */
async function sendReport(){
  if(SESSION.sent||SESSION.cards.length===0)return;
  if(!LS.g('ok'))return;
  SESSION.sent=true;
  const consultant=getName();
  const now=new Date();
  const date=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const time=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const lines=SESSION.cards.map((c,i)=>(i+1)+'. '+c.em+' '+c.nm+' — '+c.time).join('\n');
  const body=`📊 RAPPORT SESSION — Wallet Chogan\n\n👤 Consultante : ${consultant}\n📅 Date : ${date}\n🕐 Fin : ${time}\n📋 Cartes : ${SESSION.cards.length}\n\n${lines}\n\n— Wallet Chogan`;
  try{
    await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:W3F_KEY,to:ADMIN_EMAIL,subject:'[Wallet Chogan] Rapport — '+consultant+' ('+SESSION.cards.length+' cartes)',message:body,from_name:'Wallet Chogan',botcheck:''})});
  }catch(e){}
}
try{
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sendReport();});
  window.addEventListener('pagehide',sendReport);
  window.addEventListener('beforeunload',sendReport);
}catch(e){}

let _avTaps=0,_avT=null;
function avTap(){
  _avTaps++;clearTimeout(_avT);_avT=setTimeout(()=>_avTaps=0,2000);
  if(_avTaps>=5){_avTaps=0;showAdminPw();}
}

/* ── START ── */
init();
</script>
